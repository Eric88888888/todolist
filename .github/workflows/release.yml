name: Release

# 推一个 v* tag 就会自动构建并发布 Release。
# 手动触发（workflow_dispatch）只构建并上传 CI 产物，不碰 Release ——
# 这样永远不会出现"发布时创建 tag → 又触发一次构建"的循环。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 ~/.cargo 与 src-tauri/target，第二次构建能从 14 分钟降到 3~5 分钟
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 这一步同时会跑 beforeBuildCommand（pnpm build）。
      # Windows runner 自带 MSVC 与 Windows SDK，NSIS 由 Tauri 自行下载。
      - name: Build installer
        run: pnpm tauri build

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          Get-Item src-tauri/target/release/todolist.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      # 只有 tag 触发才发 Release；此时 tag 一定已存在，不会再触发一次 workflow
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 待办清单 ${{ github.ref_name }}
          body_path: docs/release-notes.md
          draft: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/todolist.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发时只留 CI 产物，方便验证打包是否正常
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: todolist-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/todolist.exe
          retention-days: 7
