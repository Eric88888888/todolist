name: Release

# 打 tag（v1.0.0 这种）就自动出 Windows 安装包并建一个草稿 Release；
# 也可以在 Actions 页面手动触发一次。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用的 tag（例如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 ~/.cargo 与 src-tauri/target，第二次构建能从 3 分钟降到 1 分钟出头
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 这一步同时会跑 beforeBuildCommand（pnpm build）。
      # Windows runner 自带 MSVC 与 Windows SDK，NSIS 由 Tauri 自行下载。
      - name: Build installer
        run: pnpm tauri build

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          Get-Item src-tauri/target/release/todolist.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # tag 触发时用 tag 名；手动触发时用输入框里的版本号
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 待办清单 ${{ inputs.tag || github.ref_name }}
          body_path: docs/release-notes.md
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/todolist.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
